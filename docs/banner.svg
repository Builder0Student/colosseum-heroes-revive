<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Colosseum Heroes Revive: a 64-bit port of a 2011 Android game">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1433"/>
      <stop offset="0.6" stop-color="#3a2350"/>
      <stop offset="1" stop-color="#6b3a3a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d4b"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0a030"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.7" stop-color="#f3e3b0"/>
      <stop offset="1" stop-color="#f3e3b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="90" cy="60" r="1.6"/><circle cx="220" cy="110" r="1.2"/><circle cx="340" cy="40" r="1.5"/>
    <circle cx="520" cy="80" r="1"/><circle cx="760" cy="50" r="1.4"/><circle cx="880" cy="120" r="1.1"/>
    <circle cx="1010" cy="70" r="1.6"/><circle cx="1150" cy="40" r="1.2"/><circle cx="1220" cy="140" r="1"/>
  </g>
  <circle cx="1160" cy="96" r="62" fill="url(#moon)"/>
  <!-- arena silhouette: a ring of arches -->
  <g fill="#24182f">
    <rect x="0" y="250" width="1280" height="70"/>
    <g fill="#2e1f3b">
      <path d="M0 250 h1280 v-38 h-1280z"/>
    </g>
  </g>
  <g fill="#1b1225">
    <path d="M40 320 v-42 a22 22 0 0 1 44 0 v42z"/><path d="M130 320 v-42 a22 22 0 0 1 44 0 v42z"/>
    <path d="M220 320 v-42 a22 22 0 0 1 44 0 v42z"/><path d="M310 320 v-42 a22 22 0 0 1 44 0 v42z"/>
    <path d="M400 320 v-42 a22 22 0 0 1 44 0 v42z"/><path d="M836 320 v-42 a22 22 0 0 1 44 0 v42z"/>
    <path d="M926 320 v-42 a22 22 0 0 1 44 0 v42z"/><path d="M1016 320 v-42 a22 22 0 0 1 44 0 v42z"/>
    <path d="M1106 320 v-42 a22 22 0 0 1 44 0 v42z"/><path d="M1196 320 v-42 a22 22 0 0 1 44 0 v42z"/>
  </g>
  <rect x="0" y="320" width="1280" height="80" fill="url(#sand)"/>
  <!-- crossed swords -->
  <g transform="translate(640 92)">
    <g transform="rotate(-38)">
      <rect x="-4" y="-46" width="8" height="78" rx="2" fill="#dfe6ee"/>
      <path d="M-4 -46 L0 -58 L4 -46z" fill="#dfe6ee"/>
      <rect x="-16" y="32" width="32" height="6" rx="2" fill="#e0a43a"/>
      <rect x="-3" y="38" width="6" height="16" rx="2" fill="#7a4a24"/>
    </g>
    <g transform="rotate(38)">
      <rect x="-4" y="-46" width="8" height="78" rx="2" fill="#dfe6ee"/>
      <path d="M-4 -46 L0 -58 L4 -46z" fill="#dfe6ee"/>
      <rect x="-16" y="32" width="32" height="6" rx="2" fill="#e0a43a"/>
      <rect x="-3" y="38" width="6" height="16" rx="2" fill="#7a4a24"/>
    </g>
  </g>
  <text x="640" y="208" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700"
        fill="url(#title)" stroke="#3b1d0e" stroke-width="2.5" paint-order="stroke" letter-spacing="2">COLOSSEUM HEROES</text>
  <text x="640" y="250" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600"
        fill="#ffffff" letter-spacing="10">REVIVE</text>
  <text x="640" y="372" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22"
        fill="#2a1608" letter-spacing="1">Unity 3.4 → 2019.4  ·  32-bit ARMv7 → 64-bit ARM64  ·  2011 → today</text>
</svg>
